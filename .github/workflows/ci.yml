# reliab's own CI. This is not a template for users; reliab is CI-agnostic.
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -timeout 300s ./...
        shell: bash
  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go install gotest.tools/gotestsum@latest
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      # reliab verifies itself. Allowed to fail until stage S0 has verified
      # the fillings in reliability-profile.yaml.
      - run: go run ./cmd/reliab verify --tier prepr
        continue-on-error: true
      - run: go run ./cmd/reliab report export --format junit -o reliab-report.xml
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reliab-report
          path: |
            reliab-report.xml
            .reliab/
          include-hidden-files: true
